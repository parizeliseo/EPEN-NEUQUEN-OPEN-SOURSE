name: Compilar APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar la firma
        id: firma
        env:
          FIRMA_B64: ${{ secrets.FIRMA_KEYSTORE_B64 }}
        run: |
          if [ -n "$FIRMA_B64" ]; then
            echo "$FIRMA_B64" | base64 -d > "$RUNNER_TEMP/epen.jks"
            echo "EPEN_FIRMA=$RUNNER_TEMP/epen.jks" >> "$GITHUB_ENV"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Falta el secreto FIRMA_KEYSTORE_B64: el APK se firma con una clave temporal y NO se publica la Release (no se podría instalar encima de la versión anterior). Ver firma/LEEME.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pruebas y compilación
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle.log
          exit ${PIPESTATUS[0]}
      - name: Mostrar el motivo del error
        if: failure()
        run: |
          grep -hE "^e: |error:|FAILED|What went wrong" -A3 gradle.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          for f in app/build/test-results/*/*.xml; do
            grep -o 'message="[^"]*"' "$f" | head -5 | while IFS= read -r l; do echo "::error file=$f::$l"; done
          done
      - name: Renombrar APK
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "EPEN-al-dia-v${VERSION}.apk"
      - name: Verificar la huella de la firma
        id: huella
        if: steps.firma.outputs.ok == 'true'
        run: |
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          REAL=$("$SIGNER" verify --print-certs EPEN-al-dia-v*.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          ESPERADA=$(tr -d '[:space:]' < firma/HUELLA.txt)
          echo "Huella del APK: $REAL"
          if [ "$REAL" != "$ESPERADA" ]; then
            echo "::error::La firma del APK ($REAL) no es la esperada ($ESPERADA). No se publica."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: EPEN-al-dia-apk
          path: EPEN-al-dia-v*.apk
      - name: Capturas de las pruebas de pantallas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: app/build/capturas/*.png
          if-no-files-found: ignore
      # Cada versión nueva en main (versionName en app/build.gradle.kts) crea su Release
      # con el APK; también se puede publicar con una etiqueta vX.Y.
      - name: Publicar en la Release
        if: github.event_name == 'push' && steps.firma.outputs.ok == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: EPEN al día v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            APK listo para instalar en Android 8.0 o superior.
            Guía: https://github.com/${{ github.repository }}/blob/main/GUIA_DE_USUARIO.md
          files: EPEN-al-dia-v*.apk
          fail_on_unmatched_files: true
